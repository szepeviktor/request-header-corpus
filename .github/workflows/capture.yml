name: Capture browser request headers

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: header-capture-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ubuntu:
    name: Capture Firefox on Ubuntu
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reset generated corpus
        run: rm -rf raw normalized manifest.json manifest-fragments

      - name: Install CA and NSS tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ca-certificates libnss3-tools mkcert

      - name: Install Firefox
        id: firefox
        uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - name: Install GeckoDriver
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="$RUNNER_TEMP/geckodriver-linux64.tar.gz"
          mkdir -p "$RUNNER_TEMP/geckodriver"
          gh release download \
            --repo mozilla/geckodriver \
            --pattern "geckodriver-*-linux64.tar.gz" \
            --output "$archive"
          tar -xzf "$archive" -C "$RUNNER_TEMP/geckodriver"
          chmod 0755 "$RUNNER_TEMP/geckodriver/geckodriver"
          echo "$RUNNER_TEMP/geckodriver" >> "$GITHUB_PATH"

      - name: Record browser and driver configuration
        shell: bash
        run: |
          "${{ steps.firefox.outputs.firefox-path }}" --version
          geckodriver --version
          echo "FIREFOX_BINARY=${{ steps.firefox.outputs.firefox-path }}" >> "$GITHUB_ENV"
          echo "GECKODRIVER=$(command -v geckodriver)" >> "$GITHUB_ENV"
          echo "DRIVER_VERSION=$(geckodriver --version | head -1 | awk '{print $2}')" >> "$GITHUB_ENV"
          echo "OBSERVATION_OS=ubuntu-24.04" >> "$GITHUB_ENV"
          echo "OBSERVATION_ARCH=$(uname -m)" >> "$GITHUB_ENV"
          echo "HEADLESS=true" >> "$GITHUB_ENV"

      - name: Create and trust the ephemeral CA
        shell: bash
        run: |
          export CAROOT="$RUNNER_TEMP/mkcert-ca"
          mkdir -p "$CAROOT" "$RUNNER_TEMP/tls" "$RUNNER_TEMP/captures"
          mkcert -install
          mkcert \
            -cert-file "$RUNNER_TEMP/tls/server.crt" \
            -key-file "$RUNNER_TEMP/tls/server.key" \
            app.test http1.app.test

          FIREFOX_PROFILE="$RUNNER_TEMP/firefox-profile"
          mkdir -p "$FIREFOX_PROFILE"
          certutil -N --empty-password -d "sql:$FIREFOX_PROFILE"
          certutil -A \
            -d "sql:$FIREFOX_PROFILE" \
            -n "GHA Header Capture Root CA" \
            -t "CT,CT," \
            -i "$CAROOT/rootCA.pem"
          echo "FIREFOX_PROFILE=$FIREFOX_PROFILE" >> "$GITHUB_ENV"

          echo "CAROOT=$CAROOT" >> "$GITHUB_ENV"
          echo "TLS_CERT=$RUNNER_TEMP/tls/server.crt" >> "$GITHUB_ENV"
          echo "TLS_KEY=$RUNNER_TEMP/tls/server.key" >> "$GITHUB_ENV"
          echo "CAPTURE_DIR=$RUNNER_TEMP/captures" >> "$GITHUB_ENV"

      - name: Configure local test domains
        run: |
          echo "127.0.0.1 app.test http1.app.test" \
            | sudo tee -a /etc/hosts >/dev/null

      - name: Start the HTTPS capture server
        shell: bash
        run: |
          sudo --preserve-env=TLS_CERT,TLS_KEY,CAPTURE_DIR \
            "$(command -v node)" collector/server.mjs >"$RUNNER_TEMP/capture-server.log" 2>&1 &
          echo "CAPTURE_SERVER_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl --fail --silent https://app.test/health | grep -qx ok &&
               curl --fail --silent https://http1.app.test:444/health | grep -qx ok; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/capture-server.log"
          exit 1

      - name: Capture all scenarios over HTTP/1.1 and HTTP/2
        run: node collector/capture.mjs --browser firefox

      - name: Validate and normalize this browser
        env:
          EXPECTED_BROWSERS: firefox
        run: |
          npm run validate
          npm run normalize
          npm run check:keys

      - name: Stop capture server
        if: always()
        run: |
          if [ -n "${CAPTURE_SERVER_PID:-}" ]; then
            sudo kill "$CAPTURE_SERVER_PID" 2>/dev/null || true
          fi

      - name: Upload browser corpus
        uses: actions/upload-artifact@v4
        with:
          name: capture-ubuntu-firefox
          path: |
            raw
            manifest-fragments
            normalized
          if-no-files-found: error
          retention-days: 14

  windows:
    name: Capture ${{ matrix.browser }} on Windows
    runs-on: windows-2025
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, edge]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and mkcert
        shell: pwsh
        run: |
          npm ci
          choco install mkcert -y

      - name: Reset generated corpus
        shell: pwsh
        run: |
          Remove-Item -Recurse -Force `
            raw, normalized, manifest-fragments `
            -ErrorAction SilentlyContinue
          Remove-Item -Force manifest.json -ErrorAction SilentlyContinue

      - name: Record browser and driver configuration
        shell: pwsh
        run: |
          if ("${{ matrix.browser }}" -eq "chrome") {
            $browserBinary = Join-Path $env:ProgramFiles "Google\Chrome\Application\chrome.exe"
            $driverBinary = Join-Path $env:CHROMEWEBDRIVER "chromedriver.exe"
            $binaryVariable = "CHROME_BINARY"
            $driverVariable = "CHROMEDRIVER"
          } else {
            $browserBinary = Join-Path ${env:ProgramFiles(x86)} "Microsoft\Edge\Application\msedge.exe"
            $driverBinary = Join-Path $env:EDGEWEBDRIVER "msedgedriver.exe"
            $binaryVariable = "EDGE_BINARY"
            $driverVariable = "EDGEDRIVER"
          }
          if (-not (Test-Path $browserBinary)) {
            throw "Browser is not installed at $browserBinary"
          }
          if (-not (Test-Path $driverBinary)) {
            throw "WebDriver is not installed at $driverBinary"
          }
          $browserVersion = (Get-Item $browserBinary).VersionInfo.ProductVersion
          $driverVersion = ((& $driverBinary --version) -split '\s+')[1]
          Write-Host "${{ matrix.browser }} $browserVersion"
          & $driverBinary --version
          "$binaryVariable=$browserBinary" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$driverVariable=$driverBinary" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "DRIVER_VERSION=$driverVersion" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OBSERVATION_OS=windows-2025" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "OBSERVATION_ARCH=$env:PROCESSOR_ARCHITECTURE" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HEADLESS=true" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create and trust the ephemeral CA
        shell: pwsh
        timeout-minutes: 3
        run: |
          $env:CAROOT = Join-Path $env:RUNNER_TEMP "mkcert-ca"
          $tls = Join-Path $env:RUNNER_TEMP "tls"
          $captures = Join-Path $env:RUNNER_TEMP "captures"
          New-Item -ItemType Directory -Force -Path $env:CAROOT, $tls, $captures | Out-Null
          $mkcert = (Get-Command mkcert.exe).Source
          $certificate = Join-Path $tls "server.crt"
          $key = Join-Path $tls "server.key"
          Write-Host "Generating the server certificate"
          & $mkcert `
            -cert-file $certificate `
            -key-file $key `
            app.test http1.app.test
          if ($LASTEXITCODE -ne 0) {
            throw "mkcert failed to create the server certificate"
          }
          $rootCaPath = Join-Path $env:CAROOT "rootCA.pem"
          Write-Host "Adding the CA to the LocalMachine Root store with certutil"
          & certutil.exe -f -addstore Root $rootCaPath
          if ($LASTEXITCODE -ne 0) {
            throw "certutil failed to trust the root CA"
          }
          "CAROOT=$env:CAROOT" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TLS_CERT=$certificate" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TLS_KEY=$key" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CAPTURE_DIR=$captures" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Configure local test domains
        shell: pwsh
        run: |
          $hosts = Join-Path $env:SystemRoot "System32\drivers\etc\hosts"
          "127.0.0.1 app.test http1.app.test" |
            Out-File -FilePath $hosts -Encoding ascii -Append

      - name: Start the HTTPS capture server
        id: windows_capture_server
        shell: pwsh
        run: node collector/server.mjs
        background: true

      - name: Wait for the HTTPS capture server
        shell: pwsh
        run: |
          for ($attempt = 1; $attempt -le 30; $attempt++) {
            try {
              $http2Response = Invoke-WebRequest `
                -Uri "https://app.test/health" `
                -UseBasicParsing
              $http1Response = Invoke-WebRequest `
                -Uri "https://http1.app.test:444/health" `
                -UseBasicParsing
              if (
                $http2Response.StatusCode -eq 200 -and
                $http2Response.Content -eq "ok" -and
                $http1Response.StatusCode -eq 200 -and
                $http1Response.Content -eq "ok"
              ) {
                exit 0
              }
            } catch {
              Start-Sleep -Seconds 1
            }
          }
          throw "HTTPS capture server did not become healthy"

      - name: Capture all scenarios over HTTP/1.1 and HTTP/2
        shell: pwsh
        run: node collector/capture.mjs --browser "${{ matrix.browser }}"

      - name: Validate and normalize this browser
        shell: pwsh
        env:
          EXPECTED_BROWSERS: ${{ matrix.browser }}
        run: |
          npm run validate
          npm run normalize
          npm run check:keys

      - name: Stop capture server
        cancel: windows_capture_server

      - name: Upload browser corpus
        uses: actions/upload-artifact@v4
        with:
          name: capture-windows-${{ matrix.browser }}
          path: |
            raw
            manifest-fragments
            normalized
          if-no-files-found: error
          retention-days: 14

  macos_chrome:
    name: Capture Chrome on macOS
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install Chrome and ChromeDriver
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          chrome-version: stable
          install-chromedriver: true

      - name: Install dependencies and mkcert
        run: |
          npm ci
          brew install mkcert

      - name: Reset generated corpus
        run: rm -rf raw normalized manifest.json manifest-fragments

      - name: Record Chrome and driver configuration
        run: |
          "${{ steps.setup-chrome.outputs.chrome-path }}" --version
          "${{ steps.setup-chrome.outputs.chromedriver-path }}" --version
          echo "CHROME_BINARY=${{ steps.setup-chrome.outputs.chrome-path }}" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER=${{ steps.setup-chrome.outputs.chromedriver-path }}" >> "$GITHUB_ENV"
          echo "DRIVER_VERSION=${{ steps.setup-chrome.outputs.chromedriver-version }}" >> "$GITHUB_ENV"
          echo "OBSERVATION_OS=macos-15" >> "$GITHUB_ENV"
          echo "OBSERVATION_ARCH=$(uname -m)" >> "$GITHUB_ENV"
          echo "HEADLESS=true" >> "$GITHUB_ENV"

      - name: Create and trust the ephemeral CA
        run: |
          export CAROOT="$RUNNER_TEMP/mkcert-ca"
          mkdir -p "$CAROOT" "$RUNNER_TEMP/tls" "$RUNNER_TEMP/captures"
          mkcert \
            -cert-file "$RUNNER_TEMP/tls/server.crt" \
            -key-file "$RUNNER_TEMP/tls/server.key" \
            app.test http1.app.test
          sudo security add-trusted-cert \
            -d -r trustRoot -p ssl \
            -k /Library/Keychains/System.keychain \
            "$CAROOT/rootCA.pem"
          echo "CAROOT=$CAROOT" >> "$GITHUB_ENV"
          echo "TLS_CERT=$RUNNER_TEMP/tls/server.crt" >> "$GITHUB_ENV"
          echo "TLS_KEY=$RUNNER_TEMP/tls/server.key" >> "$GITHUB_ENV"
          echo "CAPTURE_DIR=$RUNNER_TEMP/captures" >> "$GITHUB_ENV"

      - name: Configure local test domains
        run: |
          echo "127.0.0.1 app.test http1.app.test" \
            | sudo tee -a /etc/hosts >/dev/null

      - name: Start the HTTPS capture server
        run: |
          sudo --preserve-env=TLS_CERT,TLS_KEY,CAPTURE_DIR \
            "$(command -v node)" collector/server.mjs >"$RUNNER_TEMP/capture-server.log" 2>&1 &
          echo "CAPTURE_SERVER_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl --fail --silent https://app.test/health | grep -qx ok &&
               curl --fail --silent https://http1.app.test:444/health | grep -qx ok; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/capture-server.log"
          exit 1

      - name: Capture all scenarios over HTTP/1.1 and HTTP/2
        timeout-minutes: 1
        env:
          CAPTURE_TIMEOUT_MS: 60000
          CHROMEDRIVER_VERBOSE: true
          CHROMEDRIVER_LOG: ${{ runner.temp }}/chromedriver.log
        run: node collector/capture.mjs --browser chrome

      - name: Show ChromeDriver log
        if: failure()
        run: |
          if [ -f "$RUNNER_TEMP/chromedriver.log" ]; then
            tail -n 200 "$RUNNER_TEMP/chromedriver.log"
          fi

      - name: Validate and normalize Chrome
        env:
          EXPECTED_BROWSERS: chrome
        run: |
          npm run validate
          npm run normalize
          npm run check:keys

      - name: Stop capture server
        if: always()
        run: |
          if [ -n "${CAPTURE_SERVER_PID:-}" ]; then
            sudo kill "$CAPTURE_SERVER_PID" 2>/dev/null || true
          fi

      - name: Upload Chrome corpus
        uses: actions/upload-artifact@v4
        with:
          name: capture-macos-chrome
          path: |
            raw
            manifest-fragments
            normalized
          if-no-files-found: error
          retention-days: 14

  safari:
    name: Capture Safari on macOS
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and mkcert
        run: |
          npm ci
          brew install mkcert

      - name: Reset generated corpus
        run: rm -rf raw normalized manifest.json manifest-fragments

      - name: Enable and record Safari
        run: |
          sudo safaridriver --enable
          safaridriver --version
          defaults read /Applications/Safari.app/Contents/Info CFBundleShortVersionString
          echo "DRIVER_VERSION=$(safaridriver --version | head -1)" >> "$GITHUB_ENV"
          echo "OBSERVATION_OS=macos-15" >> "$GITHUB_ENV"
          echo "OBSERVATION_ARCH=$(uname -m)" >> "$GITHUB_ENV"
          echo "HEADLESS=false" >> "$GITHUB_ENV"

      - name: Create and trust the ephemeral CA
        run: |
          export CAROOT="$RUNNER_TEMP/mkcert-ca"
          mkdir -p "$CAROOT" "$RUNNER_TEMP/tls" "$RUNNER_TEMP/captures"
          mkcert \
            -cert-file "$RUNNER_TEMP/tls/server.crt" \
            -key-file "$RUNNER_TEMP/tls/server.key" \
            app.test http1.app.test
          sudo security add-trusted-cert \
            -d -r trustRoot -p ssl \
            -k /Library/Keychains/System.keychain \
            "$CAROOT/rootCA.pem"
          echo "CAROOT=$CAROOT" >> "$GITHUB_ENV"
          echo "TLS_CERT=$RUNNER_TEMP/tls/server.crt" >> "$GITHUB_ENV"
          echo "TLS_KEY=$RUNNER_TEMP/tls/server.key" >> "$GITHUB_ENV"
          echo "CAPTURE_DIR=$RUNNER_TEMP/captures" >> "$GITHUB_ENV"

      - name: Configure local test domains
        run: |
          echo "127.0.0.1 app.test http1.app.test" \
            | sudo tee -a /etc/hosts >/dev/null

      - name: Start the HTTPS capture server
        run: |
          sudo --preserve-env=TLS_CERT,TLS_KEY,CAPTURE_DIR \
            "$(command -v node)" collector/server.mjs >"$RUNNER_TEMP/capture-server.log" 2>&1 &
          echo "CAPTURE_SERVER_PID=$!" >> "$GITHUB_ENV"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error https://app.test/health | grep -qx ok &&
               curl --fail --silent --show-error https://http1.app.test:444/health | grep -qx ok; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/capture-server.log"
          exit 1

      - name: Capture all scenarios over HTTP/1.1 and HTTP/2
        run: node collector/capture.mjs --browser safari

      - name: Validate and normalize Safari
        env:
          EXPECTED_BROWSERS: safari
        run: |
          npm run validate
          npm run normalize
          npm run check:keys

      - name: Stop capture server
        if: always()
        run: |
          if [ -n "${CAPTURE_SERVER_PID:-}" ]; then
            sudo kill "$CAPTURE_SERVER_PID" 2>/dev/null || true
          fi

      - name: Upload Safari corpus
        uses: actions/upload-artifact@v4
        with:
          name: capture-macos-safari
          path: |
            raw
            manifest-fragments
            normalized
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Validate and publish weekly corpus
    needs: [ubuntu, windows, macos_chrome, safari]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Reset generated corpus
        run: rm -rf raw normalized manifest.json manifest-fragments

      - name: Merge browser artifacts
        uses: actions/download-artifact@v5
        with:
          pattern: capture-*
          path: .
          merge-multiple: true

      - name: Validate complete corpus
        env:
          EXPECTED_BROWSERS: chrome,edge,firefox,safari
        run: |
          npm run manifest
          npm run readme
          npm run validate
          npm run normalize
          npm run check:keys

      - name: Upload complete corpus
        uses: actions/upload-artifact@v4
        with:
          name: request-header-corpus
          path: |
            raw
            manifest.json
            normalized
          if-no-files-found: error
          retention-days: 30

      - name: Commit refreshed corpus to the repository
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw manifest.json normalized README.md
          if git diff --cached --quiet; then
            echo "Corpus is already current"
            exit 0
          fi
          git commit -m "data: refresh weekly browser header corpus"
          git push
